<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Merly Food &amp; Beverage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@500&family=Caveat:wght@500&display=swap">
<style>
/* Layout: one mobile column (max 560px) — header, active view, fixed composer + tab bar at the bottom. Light mode only. */
:root{
  /* Tailwind stone neutrals; brand is maroon #390303 */
  --bg:#F5F5F4; --surface:#FFFFFF; --sunken:#E7E5E4;
  --ink:#1C1917; --ink-2:#57534E; --muted:#78716C; --line:#E7E5E4;
  --brand:#390303; --brand-ink:#0C0A09; --brand-soft:#E7E5E4;
  --good:#1C1917; --good-soft:#F5F5F4;
  --warn:#44403C; --warn-soft:#E7E5E4;
  --thin:#44403C; --thin-soft:#D6D3D1;
  --loss:#78716C; --loss-soft:#E7E5E4;
  --g-rugi:#FCA5A5; --g-tipis:#FDE047; --g-perhatian:#D9F99D; --g-sehat:#86EFAC; /* red-300, yellow-300, lime-200, green-300 */
  --bar-out:#D6D3D1; --axis:#D6D3D1;
  --text-in:#16A34A; --text-out:#DC2626; /* green-600 / red-600, only for income and expense amounts */
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:16px; --r-md:12px; --r-sm:8px; --r-full:999px; --r:var(--r-lg);
  --tab-h:62px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
b,strong,h1,h2,h3,h4,th{font-weight:500}
button,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.mark{width:34px;height:34px;border-radius:var(--r-md);background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:500;font-size:14px;letter-spacing:-0.03em;flex:none}
.brand{min-width:0;flex:1;text-align:center;font-family:"Caveat","Segoe Script","Bradley Hand",cursive;font-size:27px;font-weight:500;line-height:1.1;letter-spacing:0;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-sync{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);background:var(--surface);border:0;padding:5px 9px;border-radius:var(--r-full);white-space:nowrap}
.chip-sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip-sync.ok i{background:var(--good)} .chip-sync.local i{background:var(--warn)} .chip-sync.err i{background:var(--loss)}
.icon-btn{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--sunken)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 24px)}
main.with-composer{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 136px)}
.view{display:flex;flex-direction:column;gap:12px;padding-block:4px 8px}

.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:#292524;border-radius:var(--r-lg);padding:10px 12px;font-size:14px}
.banner.info{background:var(--brand-soft);color:var(--brand-ink)}
.banner button{margin-left:auto;font-weight:500;text-decoration:underline;white-space:nowrap}

/* cards */
.card{background:var(--surface);border:0;border-radius:var(--r-lg);padding:16px}
.card h3{margin:0;font-size:14px;font-weight:500;color:var(--ink-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sub{font-size:14px;color:var(--muted)}
.label{font-size:14px;color:var(--muted);font-weight:500}

/* today strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip > div{background:var(--surface);border:0;border-radius:var(--r-lg);padding:12px;min-width:0}
.strip b{display:block;font-size:16px;font-weight:500;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg{display:flex;align-items:flex-start;gap:3px;font-size:14px;font-weight:500;margin-top:6px;line-height:1.3;max-width:100%}
.chg svg{width:14px;height:14px;margin-top:1px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chg.up{color:var(--text-in)} .chg.down{color:var(--text-out)} .chg.flat{color:var(--muted)}
.chg-sub{display:block;font-size:14px;color:var(--muted);line-height:1.3;margin-top:1px}
.c-in{color:var(--text-in)} .c-out{color:var(--text-out)}

/* chat */
.feed{display:flex;flex-direction:column;gap:8px}
.day-div{align-self:center;font-size:14px;color:var(--muted);background:var(--surface);padding:3px 10px;border-radius:var(--r-full);margin-block:6px 2px}
.bub{max-width:86%;padding:12px;border-radius:var(--r-lg);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:var(--r-sm)}
.bub.bot{align-self:flex-start;background:var(--surface);border:0;border-bottom-left-radius:var(--r-sm)}
.bub.bot.err{background:var(--loss-soft);border-color:transparent;color:#292524}
.bub .t{display:block;font-size:14px;opacity:.7;margin-top:3px;text-align:right}
.bub.pending{color:var(--muted)}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.rec{align-self:flex-start;width:min(100%,420px);background:var(--surface);border-radius:var(--r-lg);border-bottom-left-radius:var(--r-sm);padding:0;display:flex;flex-direction:column;gap:0}
.rec-head{padding:0 14px 2px;font-size:14px;font-weight:500;color:var(--good)}
.rec-row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:12px;text-align:left;width:100%;border-radius:inherit;transition:background-color .15s ease}
.rec-row:last-child{border-bottom-left-radius:var(--r-sm)}
.rec-row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.rec-row:disabled{cursor:default}
.rec-row .meta{grid-column:1;font-size:14px;color:var(--muted)}
.dchip{grid-column:2;justify-self:end;align-self:center;font-size:14px;font-weight:500;color:var(--ink-2);background:#F5F5F4;padding:2px 8px;border-radius:var(--r-full);opacity:0;transform:translateY(2px);transition:opacity .15s ease,transform .15s ease;pointer-events:none}
@media (hover:hover){.rec-row:not(:disabled):hover .dchip{opacity:1;transform:none}}
.rec-row:focus-visible .dchip{opacity:1;transform:none}
.dir{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center}
.cat-ic{width:36px;height:36px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--ic-bg);color:var(--ic-fg)}
.cat-ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.dir.in{background:var(--good-soft);color:var(--good)} .dir.out{background:var(--loss-soft);color:var(--loss)} .dir.non{background:var(--sunken);color:var(--ink-2)}
.dir svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.rec-row .note{font-size:14px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.catbtn{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--brand);background:var(--brand-soft);padding:2px 8px;border-radius:var(--r-full);margin-top:3px}
.catbtn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4}
.amt{font-weight:500;white-space:nowrap}
.rec-foot{display:flex;justify-content:space-between;align-items:center;padding:7px 12px 9px;font-size:14px;color:var(--muted);border-top:1px solid var(--line)}
.rec-foot button{color:var(--ink-2);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.rec.undone{opacity:.5}

.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* composer */
.composer{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding-bottom:26px;z-index:15;background:linear-gradient(to top,var(--bg) 82%,transparent)}
.composer .wrap{padding-block:10px 10px}
.suggest{display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px;margin-inline:-2px}
.suggest::-webkit-scrollbar{display:none}
.suggest button{flex:none;font-size:14px;background:var(--surface);border:0;padding:6px 11px;border-radius:var(--r-full);color:var(--ink-2)}
.suggest button:hover{background:var(--brand-soft);color:var(--brand)}
.inbox{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:0;border-radius:var(--r-lg);padding:6px 6px 6px 14px;box-shadow:0 4px 18px rgba(28,25,23,.06)}
.inbox:focus-within{box-shadow:0 0 0 2px var(--brand-soft),0 4px 18px rgba(28,25,23,.06)}
.inbox textarea{flex:1;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.4;max-height:120px;padding-block:7px;min-width:0}
.send{width:38px;height:38px;border-radius:var(--r-md);background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{opacity:.4;cursor:default}
.send svg{stroke:#fff}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tab-h)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;color:var(--muted);text-decoration:none;font-weight:500}
.tabbar a[aria-current="page"]{color:var(--brand)}
.tabbar a svg{width:22px;height:22px}
.tabbar a.fab{justify-content:flex-end;padding-bottom:9px;gap:8px}
.fab-ic{width:54px;height:54px;flex:0 0 auto;aspect-ratio:1;margin-top:-34px;border-radius:var(--r-full);background:var(--brand);display:grid;place-items:center;box-shadow:none;outline:0;border:0;transition:transform .45s cubic-bezier(.34,1.8,.5,1)}
.tabbar a.fab .fab-ic svg{width:22px;height:22px;stroke:#fff;stroke-width:1.8}
/* Line-drawing animation for every clickable icon: strokes are traced one after another, vector to vector */
svg.drawing :is(path,line,circle,rect,polyline,polygon,ellipse){stroke-dasharray:1;animation:iconDraw var(--d,400ms) cubic-bezier(.45,0,.25,1) var(--dl,0ms) both}
@keyframes iconDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){svg.drawing :is(path,line,circle,rect,polyline,polygon,ellipse){animation:none!important}}
.tabbar a.fab:focus-visible{outline:0}.tabbar a.fab:focus-visible .fab-ic{outline:2px solid var(--brand);outline-offset:2px}
.tabbar a.fab:active .fab-ic{transform:scale(.94)}
@media (hover:hover){.tabbar a.fab:hover .fab-ic{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.fab-ic{transition:none}}

/* segmented */
.seg{display:flex;background:#F5F5F4;border-radius:var(--r-md);padding:3px;gap:0}
.seg button{flex:1 1 auto;white-space:nowrap;padding:7px 4px;border-radius:var(--r-sm);font-size:14px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(28,25,23,.1)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pnav b{font-size:14px;font-weight:500;text-align:center;flex:1}
.ppick{position:relative;flex:1;min-width:0}
.range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hrow-bar .search{flex:1;min-width:0;height:44px}
.hrow-bar .hp-sel{flex:0 0 132px}
.hrow-bar .hp-sel select,.hrow-bar .cal{height:44px}
.hrow-bar .hp-sel select{border-radius:var(--r-md);text-align:left;text-align-last:left;padding-left:12px}
.prow{position:relative;display:flex;gap:8px;align-items:stretch}
.prow .seg{flex:1;min-width:0}
.cal{width:42px;flex:none;border-radius:var(--r-md);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.cal[aria-pressed="true"],.cal[aria-expanded="true"]{color:var(--ink)}
.range-pop{position:absolute;right:0;top:calc(100% + 8px);z-index:12;width:min(340px,100%);background:var(--surface);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(28,25,23,.16)}
.range-pop .ppick input{background:var(--sunken)}
.range .ppick{display:flex;flex-direction:column;gap:4px}
.range-l{font-size:14px;color:var(--muted)}
.ppick select,.ppick input{width:100%;appearance:none;-webkit-appearance:none;border:0;border-radius:var(--r-md);background:var(--surface);height:34px;padding:0 32px 0 12px;font-size:14px;font-weight:500;color:var(--ink);text-align:center;text-align-last:center;cursor:pointer;outline:0}
.ppick input{padding:0 12px}
.ppick select:focus-visible,.ppick input:focus-visible{box-shadow:0 0 0 2px var(--ink)}
.ppick svg{position:absolute;right:10px;top:50%;width:16px;height:16px;transform:translateY(-50%);pointer-events:none;stroke:var(--muted);fill:none;stroke-width:2}
.pnav button{width:34px;height:34px;border-radius:var(--r-md);display:grid;place-items:center;background:var(--surface);border:0}
.pnav button:disabled{opacity:.35;cursor:default}

/* health */
.health{display:flex;flex-direction:column;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:4px 10px;border-radius:var(--r-full)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-sehat{background:var(--good-soft);color:var(--good)}
.st-perhatian{background:var(--warn-soft);color:var(--warn)}
.st-menipis{background:var(--thin-soft);color:var(--thin)}
.st-rugi{background:var(--ink);color:#fff}
.st-kosong{background:var(--sunken);color:var(--muted)}
.big{font-size:16px;font-weight:500;letter-spacing:-0.035em;line-height:1.05}
.big.neg{color:var(--loss)}
.delta{font-size:14px;font-weight:500}
.delta.up{color:var(--good)} .delta.down{color:var(--loss)} .delta.flat{color:var(--muted)}
.gauge2{position:relative;display:flex;gap:4px;height:14px;margin-top:30px}
.gz{border-radius:var(--r-full);min-width:6px}
.knob{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(28,25,23,.22),inset 0 0 0 6px var(--kc);animation:knob-pop .6s cubic-bezier(.34,1.56,.64,1) both}
.knob b{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--kc);color:#fff;font-size:14px;font-weight:500;padding:3px 8px;border-radius:var(--r-full);white-space:nowrap}
.knob b::after{content:"";position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--kc)}
@keyframes knob-pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.gauge{position:relative;height:10px;border-radius:var(--r-full);background:linear-gradient(to right,var(--g-rugi) 0 var(--g0),var(--g-tipis) var(--g0) var(--g1),var(--g-perhatian) var(--g1) var(--g2),var(--g-sehat) var(--g2) 100%);box-shadow:inset 0 0 0 1px rgba(28,25,23,.06)}
.gauge .needle{position:absolute;top:-4px;width:4px;height:18px;border-radius:var(--r-full);background:var(--ink);transform:translateX(-50%)}
.target{display:flex;flex-direction:column;gap:6px}
.target-h{display:flex;justify-content:space-between;font-size:14px;color:var(--ink-2)}
.target-bar{height:8px;border-radius:var(--r-full);background:var(--sunken);overflow:hidden}
.target-bar i{display:block;height:100%;border-radius:var(--r-full);background:var(--ink)}
.gauge-l{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:6px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv > div{background:var(--bg);border-radius:var(--r-lg);padding:10px}
.kv b{display:block;font-size:14px;font-weight:500;margin-top:2px}

/* insights */
.ins{display:flex;flex-direction:column;gap:12px;margin:0;padding:0}
.ins-item{display:grid;grid-template-columns:6px 1fr;gap:10px;align-items:start}
.ins-item::before{content:"";width:6px;height:6px;border-radius:50%;margin-top:7px;background:var(--muted)}
.ins-item.l-good::before{background:var(--text-in)} .ins-item.l-warn::before{background:#F59E0B} .ins-item.l-thin::before{background:#F97316} .ins-item.l-loss::before{background:var(--text-out)}
.ins-item b{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.ins-item span{font-size:14px;color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart-wrap{position:relative}
.tip{position:absolute;top:0;z-index:2;min-width:150px;max-width:220px;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:12px;font-size:14px;line-height:1.4;box-shadow:0 8px 24px rgba(28,25,23,.18);pointer-events:none}
.tip b{display:block;font-weight:500;margin-bottom:4px}
.tip div{display:flex;justify-content:space-between;gap:12px;color:#D6D3D1}
.tip div span:last-child{color:#fff}
.tip .tin{color:#86EFAC!important} .tip .tout{color:#FCA5A5!important}
.chart .ax{font-size:14px;fill:var(--muted);font-family:var(--font)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--axis);stroke-width:1}
.chart .b-pos{fill:var(--text-in)} .chart .b-neg{fill:var(--text-out)}
.chart .b-in{fill:var(--brand)} .chart .b-out{fill:var(--bar-out)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .sel{fill:var(--sunken)}
.chart-cap{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.legend{display:flex;gap:12px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:var(--r-full);margin-right:5px;vertical-align:-1px}
.mini-seg{display:inline-grid;grid-auto-flow:column;background:#F5F5F4;border-radius:var(--r-md);padding:2px}
.mini-seg button{font-size:14px;padding:4px 9px;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500}
.mini-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(28,25,23,.1)}

/* category bars */
.bars{display:flex;flex-direction:column;gap:10px}
.donut-wrap{display:grid;place-items:center;padding:4px 0 14px}
.donut{width:160px;height:160px;max-width:100%}
.donut-l{font-size:14px;fill:var(--muted);font-family:var(--font)}
.donut-v{font-size:14px;font-weight:500;fill:var(--ink);font-family:var(--font)}
.cat-list{display:flex;flex-direction:column;gap:10px}
.cat-row{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;font-size:14px}
.cat-name{min-width:0;overflow-wrap:anywhere}
.cat-pct{display:block;font-size:14px;color:var(--muted)}
.cat-tot{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line);font-size:14px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:14px}

<script>
(() => {

const HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];

/* ---------- utils ---------- */

const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const startWeek = d => { const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + "." + pad(d.getMinutes()); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rp = n => (n < 0 ? "−Rp " : "Rp ") + Math.round(Math.abs(n)).toLocaleString("id-ID");
function rpS(n) {
  const a = Math.abs(n), s = n < 0 ? "−" : "";
  const f = (v, u) => s + "Rp " + (Math.round(v * 10) / 10).toLocaleString("id-ID") + u;
  if (a >= 1e9) return f(a / 1e9, " M");
  if (a >= 1e6) return f(a / 1e6, " jt");
  if (a >= 1e3) return s + "Rp " + Math.round(a / 1e3).toLocaleString("id-ID") + " rb";
  return s + "Rp " + Math.round(a);
}
const pct = (a, b) => b > 0 ? a / b * 100 : 0;
const fmtPct = v => (Math.round(v * 10) / 10).toLocaleString("id-ID") + "%";
function dayLabel(s) {

  if (s === t) return "Hari ini";
  if (s === y) return "Kemarin";

const ICON = {

  out: '<svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>',

/* One icon per category, in Tailwind -100 / -600 pairs, so each row reads at a glance. */
const CAT_IC = {

  online:     ["#E0F2FE", "#0284C7", '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>'],
  pesanan:    ["#EDE9FE", "#7C3AED", '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>'],
  lain_masuk: ["#FEF3C7", "#D97706", '<circle cx="9" cy="9" r="5"/><path d="M15.5 9.5a5 5 0 1 1-6 6"/>'],
  modal:      ["#CCFBF1", "#0D9488", '<path d="M4 7h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4z"/><path d="M4 7l11-3v3"/><circle cx="16" cy="13" r="1"/>'],

  belanja:    ["#ECFCCB", "#65A30D", '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M3 4h2l2.5 11h11L21 7H6"/>'],

  sewa:       ["#FAE8FF", "#C026D3", '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'],
  utilitas:   ["#FEF9C3", "#CA8A04", '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>'],
  transport:  ["#CFFAFE", "#0891B2", '<path d="M3 6h11v10H3z"/><path d="M14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>'],
  marketing:  ["#FCE7F3", "#DB2777", '<path d="M3 10v4h4l8 5V5l-8 5H3z"/><path d="M18 9a4 4 0 0 1 0 6"/>'],
  komisi:     ["#FFE4E6", "#E11D48", '<path d="M19 5L5 19"/><circle cx="7" cy="7" r="2"/><circle cx="17" cy="17" r="2"/>'],
  lain_keluar:["#F5F5F4", "#57534E", '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'],
  investasi:  ["#DBEAFE", "#2563EB", '<rect x="6" y="3" width="12" height="18" rx="2"/><path d="M6 10h12"/><path d="M9 6v2M9 13v3"/>'],
  prive:      ["#F3E8FF", "#9333EA", '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'],
};
const catIcon = c => { const [bg, fg, d] = CAT_IC[c] || CAT_IC.lain_keluar; return `<span class="cat-ic" style="--ic-bg:${bg};--ic-fg:${fg}" aria-hidden="true"><svg viewBox="0 0 24 24">${d}</svg></span>`; };
const dirOf = tx => CATS[tx.cat]?.grp === "non" ? "non" : tx.type;

/* ---------- state ---------- */
const S = {
  mode: "loading",        // loading | cloud | local
  stale: false, error: null,
  readOnly: false,
  ai: null,
  days: {},               // date -> {date, tx:{id:{...}}}
  txs: [],                // flattened live transactions, newest first
  settings: { warn: 10, good: 20 },
  tab: "catat",
  session: [],            // chat items not stored: questions, answers, pending, errors
  period: { kind: "month", anchor: today() },
  chartMode: "laba", chartSel: null,
  hFilter: "all", hSearch: "", hLimit: 120, catTab: "out",
};

function rebuild() {
  const out = [];
  for (const [date, doc] of Object.entries(S.days)) {
    const map = doc && doc.tx || {};
    for (const [id, t] of Object.entries(map)) {
      if (!t || t.deleted || !CATS[t.cat] || !(Number(t.amount) > 0)) continue;
      out.push({ ...t, id, date, amount: Number(t.amount), type: CATS[t.cat].type });
    }
  }
  out.sort((a, b) => (b.date.localeCompare(a.date)) || ((b.ts || 0) - (a.ts || 0)));
  S.txs = out;
}

/* ---------- storage: cloud (db capability) or local ---------- */
let DB = null;
const queues = {};
function local() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null") || { days: {}, settings: {} }; } catch { return { days: {}, settings: {} }; } }
function saveLocal(o) { try { localStorage.setItem(LS_KEY, JSON.stringify(o)); } catch {} }
function deepMerge(a, b) {
  const o = { ...(a || {}) };
  for (const [k, v] of Object.entries(b)) o[k] = (v && typeof v === "object" && !Array.isArray(v) && o[k] && typeof o[k] === "object") ? deepMerge(o[k], v) : v;
  return o;
}
// path is "days/<date>" or "settings/main"
function docWrite(path, op, body) {
  if (S.mode === "cloud") {
    const p = (queues[path] || Promise.resolve()).catch(() => {}).then(() => {
      const ref = DB.doc(path);
      return op === "set" ? ref.set(body) : op === "update" ? ref.update(body) : ref.delete();
    });
    queues[path] = p;
    return p;
  }
  const L = local();
  const [col, id] = path.split("/");
  const bucket = col === "days" ? L.days : null;
  if (col === "settings") { L.settings = op === "delete" ? {} : op === "set" ? body : deepMerge(L.settings, body); }
  else if (op === "set") bucket[id] = body;
  else if (op === "delete") delete bucket[id];
  else { if (!bucket[id]) return Promise.reject({ code: "invalid_argument" }); bucket[id] = deepMerge(bucket[id], body); }
  saveLocal(L);
  S.days = L.days; S.settings = { ...L.settings, warn: 10, good: 20 };
  rebuild(); render();
  return Promise.resolve();
}
const clean = t => { const o = { type: t.type, cat: t.cat, amount: Math.round(t.amount), note: t.note || "", ts: t.ts || Date.now() }; if (t.raw) o.raw = t.raw; if (t.msg) o.msg = t.msg; if (t.sample) o.sample = true; return o; };
async function putTx(t) {
  const path = "days/" + t.date, body = { date: t.date, tx: { [t.id]: clean(t) } };
  if (S.days[t.date]) return docWrite(path, "update", body);
  try { await docWrite(path, "update", body); }
  catch (e) { if (e && (e.code === "invalid_argument" || e.code === "transform_error")) await docWrite(path, "set", body); else throw e; }
}
const dropTx = t => docWrite("days/" + t.date, "update", { tx: { [t.id]: { deleted: true } } });
async function editTx(prev, next) {
  if (prev && prev.date !== next.date) { await putTx(next); await dropTx(prev); }
  else await putTx(next);
}
async function clearSamples() {
  for (const [date, doc] of Object.entries(S.days)) {
    const live = Object.entries(doc.tx || {}).filter(([, t]) => t && !t.deleted);
    const samp = live.filter(([, t]) => t.sample);
    if (!samp.length) continue;
    if (samp.length === live.length) await docWrite("days/" + date, "delete");
    else await docWrite("days/" + date, "update", { tx: Object.fromEntries(samp.map(([id]) => [id, { deleted: true }])) });
  }

function startLocal() {
  S.mode = "local";
  const L = local();
  S.days = L.days || {}; S.settings = { ...(L.settings || {}), warn: 10, good: 20 };
  rebuild(); render();
}
function startCloud(db) {
  DB = db; S.mode = "cloud";
  let timer = setTimeout(() => { S.stale = true; render(); }, 10000);
  const from = iso(addDays(today(), -800));
  db.collection("days").where("date", ">=", from).orderBy("date", "desc").limit(1000).onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { m[d.id] = d.data(); });
    S.days = m; rebuild();
    if (!snap.metadata.fromCache) { clearTimeout(timer); S.stale = false; }
    S.loaded = true; render();
  }, err => { clearTimeout(timer); S.error = err; S.stale = false; render(); });
  db.doc("settings/main").onSnapshot(snap => {
    S.settings = { ...(snap.exists ? snap.data() : {}), warn: 10, good: 20 }; render();
  }, () => {});

/* ---------- aggregation ---------- */
function agg(from, to) {
  const a = { pend: 0, opex: 0, modal: 0, inv: 0, prive: 0, byCat: {}, count: 0, days: new Set() };
  for (const t of S.txs) {
    if (t.date < from || t.date > to) continue;
    a.count++; a.days.add(t.date);
    a.byCat[t.cat] = (a.byCat[t.cat] || 0) + t.amount;
    const c = CATS[t.cat];
    if (t.cat === "modal") a.modal += t.amount;
    else if (t.cat === "investasi") a.inv += t.amount;
    else if (t.cat === "prive") a.prive += t.amount;
    else if (c.type === "in") a.pend += t.amount;
    else a.opex += t.amount;
  }
  a.laba = a.pend - a.opex;
  a.margin = pct(a.laba, a.pend);
  a.kas = a.pend + a.modal - a.opex - a.inv - a.prive;
  return a;
}
function status(a) {
  if (a.pend === 0 && a.opex === 0) return { k: "kosong", t: "Belum ada data" };
  if (a.laba < 0) return { k: "rugi", t: "Rugi" };
  if (a.margin < S.settings.warn) return { k: "menipis", t: "Keuntungan menipis" };
  if (a.margin < S.settings.good) return { k: "perhatian", t: "Perlu perhatian" };
  return { k: "sehat", t: "Sehat" };
}
function periodOf(kind, anchor, range) {
  const A = new Date(anchor); A.setHours(0, 0, 0, 0);
  let from, to, pf, pt, label, buckets = [], chartTitle, prevName;
  if (kind === "custom") {
    // manual range: compared with the same number of days right before it
    from = fromIso(range.from); to = fromIso(range.to);
    const days = Math.round((to - from) / 864e5) + 1;
    pt = addDays(from, -1); pf = addDays(from, -days);

      if (r && typeof r === "object" && r.intent) {
        r.records = (Array.isArray(r.records) ? r.records : []).filter(x => x && CATS[x.cat] && Number(x.amount) > 0).map(x => ({
          cat: x.cat, amount: Math.round(Number(x.amount)), note: String(x.note || CATS[x.cat].label).slice(0, 80),
          date: /^\d{4}-\d{2}-\d{2}$/.test(x.date || "") && x.date <= iso(today()) ? x.date : iso(today()),
        }));
        if (r.intent === "record" && !r.records.length) r.intent = "chat";
        r.via = "ai";
        return r;
      }
    } catch (e) { /* fall back to rules */ }
  }
  const r = ruleParse(text); r.via = "rules";
  if (r.intent === "question") r.answer = ruleAnswer(text);
  if (r.intent === "chat") r.answer = "Saya belum menemukan nominalnya. Coba tulis seperti: \"belanja ayam 350rb\" atau \"jual hari ini 1,2jt\". Bisa juga tanya: \"untung bulan ini berapa?\"";
  return r;
}

async function send(text) {
  text = text.trim();
  if (!text || S.readOnly) return;
  const ts = Date.now();
  const pend = { kind: "pending", ts: ts + 1, text };
  S.session.push({ kind: "me", text, ts }, pend);
  render(); scrollFeed();
  let r;
  try { r = await understand(text); } catch { r = { intent: "chat", answer: "Pesan belum bisa diproses. Coba kirim lagi." }; }
  S.session = S.session.filter(x => x !== pend);
  if (r.intent === "record" && r.records.length) {
    S.session = S.session.filter(x => !(x.kind === "me" && x.ts === ts));
    const msg = "m" + ts.toString(36);
    try {
      for (let i = 0; i < r.records.length; i++) {
        const x = r.records[i];
        await putTx({ id: uid(), date: x.date, cat: x.cat, type: CATS[x.cat].type, amount: x.amount, note: x.note, ts: ts + i, raw: text, msg });
      }
      if (r.answer) S.session.push({ kind: "bot", text: r.answer, ts: ts + 50, after: msg });
    } catch (e) {
      S.session.push({ kind: "me", text, ts }, { kind: "err", ts: ts + 2, text: "Catatan belum tersimpan. " + (e && e.code === "quota_exceeded" ? "Penyimpanan penuh." : "Periksa koneksi, lalu kirim lagi.") });
    }
  } else {
    S.session.push({ kind: "bot", text: r.answer || "Oke.", ts: ts + 2 });
  }
  render(); scrollFeed();
}

  let acc = 0, segs = "";

    acc += share;

/* One day split by hour, from the transactions' own times; at least 07.00–21.00 so a quiet day still reads as a day. */
function hourBuckets(date) {

      if (t.type === "in") pend += t.amount; else opex += t.amount;
    }
    out.push({ from: date, to: date, hour: h, x: String(h), long: dayLabel(date) + ", " + pad(h) + ".00–" + pad(h + 1) + ".00", pend, opex, laba: pend - opex });

}

    const bw = Math.max(2, Math.min(io ? slot * 0.36 : slot * 0.62, 22));

    }

    if (i % every === 0 || i === n - 1) s += `<text class="ax" x="${x + slot / 2}" y="${H - 5}" text-anchor="middle" ${b.now ? 'style="fill:var(--ink);font-weight:500"' : b.future ? 'style="opacity:.45"' : ""}>${esc(b.x)}</text>`;
    s += `<rect class="hit" data-bar="${i}" x="${x}" y="0" width="${slot}" height="${H}"/>`;

}

/* Monthly profit target scaled to the selected period: day = /30, week = ×7/30, year = ×12. */
function periodTarget(P) {
  const m = Number(S.settings.target) || 0;
  if (!m) return 0;
  return P.kind === "day" ? m / 30 : P.kind === "week" ? m * 7 / 30 : P.kind === "year" ? m * 12 : P.kind === "custom" ? m * P.days / 30 : m;
}
function targetBlock(P, a) {

  const pctv = Math.max(0, a.laba) / t * 100, left = t - a.laba;
  return `<div class="target"><div class="target-h"><span>Target keuntungan</span><span class="num">${fmtPct(pctv)}</span></div>
    <div class="target-bar"><i style="width:${Math.min(100, pctv)}%"></i></div>
    <div class="sub num">${left > 0 ? "Kurang " + rpS(left) + " dari target " + rpS(t) : "Target " + rpS(t) + " tercapai, lebih " + rpS(-left)}</div></div>`;
}
/* This month measured against both settings: the margin threshold and the nominal profit target. */
function targetEvaluation() {
  const T = today(), P = periodOf("month", T), a = agg(P.from, P.to), st = status(a);
  const items = [];
  if (st.k === "kosong") items.push({ l: "", t: "Belum ada catatan bulan ini", d: "Evaluasi muncul setelah ada pemasukan atau pengeluaran." });
  else {
    const W = S.settings.warn;
    if (a.laba < 0) items.push({ l: "loss", t: "Margin: rugi " + rpS(-a.laba), d: "Biaya operasional bulan ini melebihi pemasukan." });
    else if (a.margin < W) items.push({ l: "thin", t: "Margin " + fmtPct(a.margin) + ", di bawah batas " + W + "%", d: "Keuntungan menipis. Tekan biaya bahan atau naikkan harga menu laris." });
    else items.push({ l: "good", t: "Margin " + fmtPct(a.margin) + ", aman di atas batas " + W + "%", d: "Selisih " + fmtPct(a.margin - W) + " dari batas menipis." });
    const tgt = Number(S.settings.target) || 0;
    if (tgt) {
      const end = new Date(T.getFullYear(), T.getMonth() + 1, 0), daysLeft = Math.round((end - T) / 864e5) + 1;
      const elapsed = T.getDate(), pace = a.laba / elapsed * end.getDate(), need = tgt - a.laba;
      if (need <= 0) items.push({ l: "good", t: "Target " + rpS(tgt) + " sudah tercapai", d: "Laba bulan ini " + rpS(a.laba) + ", lebih " + rpS(-need) + " dari target." });
      else if (pace >= tgt) items.push({ l: "good", t: "Sesuai jalur menuju target " + rpS(tgt), d: "Laba " + rpS(a.laba) + " (" + fmtPct(a.laba / tgt * 100) + "). Dengan laju sekarang, perkiraan akhir bulan " + rpS(pace) + "." });
      else items.push({ l: "warn", t: "Kurang " + rpS(need) + " dari target " + rpS(tgt), d: "Butuh rata-rata laba " + rpS(need / daysLeft) + " per hari selama " + daysLeft + " hari tersisa. Laju sekarang diperkirakan " + rpS(Math.max(0, pace)) + " di akhir bulan." });
    } else items.push({ l: "", t: "Target nominal belum diisi", d: "Isi target keuntungan per bulan di atas untuk melihat progres." });
  }
  return `<div class="field"><span class="label">Evaluasi ${esc(P.label)}</span><div class="ins">${items.map(i => `<div class="ins-item ${i.l ? "l-" + i.l : ""}"><div><b>${esc(i.t)}</b><span>${esc(i.d)}</span></div></div>`).join("")}</div></div>`;
}

const grow = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; };
input.addEventListener("input", grow);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#chatForm").requestSubmit(); } });
$("#chatForm").addEventListener("submit", e => { e.preventDefault(); const v = input.value; input.value = ""; grow(); send(v); });
$("#suggest").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.kind === "ask") { send(b.dataset.text); return; }
  input.value = b.dataset.text; grow(); input.focus();
  try { input.setSelectionRange(input.value.length, input.value.length); } catch {}
});

const TABS = ["catat", "ringkasan", "riwayat"];
function route() { const h = location.hash.slice(1); S.tab = TABS.includes(h) ? h : "catat"; closeSheet(); render(); if (S.tab === "catat") scrollFeed(); else window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);


/* ---------- icon line-drawing ----------
   Every icon inside a link or button is traced stroke by stroke: each sub-path (split at "M") gets its
   own slot, so the line runs from one vector end to the next instead of all at once. Plays on hover and tap,
   and once for the tab bar when the app opens. */
const ICON_SHAPES = "path,line,circle,rect,polyline,polygon,ellipse";
function prepIcon(svg) {
  if (svg.dataset.prep) return;
  svg.querySelectorAll("path").forEach(p => {
    const d = p.getAttribute("d") || "";
    if (/m/.test(d)) return; // relative moves can't be split safely
    const parts = d.split(/(?=M)/).map(x => x.trim()).filter(Boolean);
    if (parts.length < 2) return;
    parts.forEach(part => { const q = p.cloneNode(); q.setAttribute("d", part); p.before(q); });
    p.remove();
  });
  svg.querySelectorAll(ICON_SHAPES).forEach(e => e.setAttribute("pathLength", "1"));
  svg.dataset.prep = "1";
}
function drawIcon(svg) {
  prepIcon(svg);
  const els = [...svg.querySelectorAll(ICON_SHAPES)], n = els.length || 1;
  const total = Math.min(1500, 450 + n * 220), per = total / n;
  els.forEach((e, i) => { e.style.setProperty("--d", per + "ms"); e.style.setProperty("--dl", i * per + "ms"); });
  svg.classList.remove("drawing"); void svg.getBoundingClientRect(); svg.classList.add("drawing");
}
const iconsIn = el => [...el.querySelectorAll("svg")].filter(v => !v.matches("[role=img]") && !v.closest("[role=img]"));
document.addEventListener("pointerover", e => {
  const el = e.target.closest && e.target.closest("a,button"); if (!el) return;
  if (e.relatedTarget && el.contains(e.relatedTarget)) return;
  iconsIn(el).forEach(drawIcon);
});
document.addEventListener("click", e => {
  const el = e.target.closest && e.target.closest("a,button"); if (el) iconsIn(el).forEach(drawIcon);
}, true);
document.querySelectorAll(".tabbar svg").forEach(drawIcon);
/* ---------- boot ---------- */
route();
(async () => {
  const C = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  if (!C) { startLocal(); return; }
  C.use("sample").then(s => { if (s) { S.ai = s; render(); } }).catch(() => {});
  let db = null;
  try { db = await C.use("db"); } catch {}
  if (!db) { startLocal(); return; }
  startCloud(db);
  try {
    const u = await C.use("user");
    if (u) { const can = await u.can("data.write"); if (can === false) { S.readOnly = true; render(); } }
  } catch {}
})();
})();
</script>
